# Mirrors lesomnus/forge-mirror-test into a GitLab this job starts, then does it
# again.
#
# The second run is the point. Everything else here could be checked with fakes,
# and is; what cannot be is whether a real GitLab hands back the same issue when
# it is asked by marker, and therefore whether an hourly job quietly fills the
# target with duplicates. Nobody watches a disaster-recovery copy closely enough
# to notice.
#
# GitLab is started from the stock image and seeded here rather than baked
# beforehand. Baking was tried and does not work: the image declares
# `/etc/gitlab`, `/var/log/gitlab` and `/var/opt/gitlab` as volumes, and
# `docker commit` does not capture volume contents — so the database holding the
# seeded token is exactly the part that is not saved. A cold boot is about three
# minutes and seeding another forty seconds, which is a fine price for one less
# image, one less workflow and one less registry to depend on.
#
# Not on every push all the same: four minutes and a few gigabytes is not free.
name: e2e

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    paths:
      - "forge/**"
      - "mirror/**"
      - ".github/workflows/e2e.yaml"

permissions:
  contents: read

env:
  GITLAB: http://localhost:8080
  # Only ever valid against the throwaway container started below, which is
  # created and destroyed inside this job. There is nothing behind it.
  GITLAB_TOKEN: glpat-forgemirrore2etoken
  FIXTURE_OWNER: lesomnus
  FIXTURE_REPO: forge-mirror-test

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start GitLab
        run: |
          set -eu
          # ⚠️ `puma['port']` has to move off 8080. Omnibus defaults puma to
          # 127.0.0.1:8080, and `external_url` with a port puts **nginx** on the
          # same one. nginx wins, puma dies with EADDRINUSE, and runit restarts
          # it forever — which from outside looks like a slow boot, because
          # nginx and workhorse are up and answering 502 the whole time.
          docker run -d --name gitlab \
            --shm-size 256m \
            -p 8080:8080 \
            -e GITLAB_OMNIBUS_CONFIG="
              external_url 'http://localhost:8080';
              puma['port'] = 8081;
              puma['worker_processes'] = 0;
              sidekiq['max_concurrency'] = 2;
              postgresql['shared_buffers'] = '128MB';
              prometheus_monitoring['enable'] = false;
              gitlab_rails['gitlab_shell_ssh_port'] = 2222;
            " \
            gitlab/gitlab-ce:19.3.1-ce.0

      - name: Wait for it
        run: |
          set -eu
          for i in $(seq 1 60); do
            # From **inside** the container. GitLab limits `/-/health` to
            # `monitoring_whitelist`, 127.0.0.0/8 by default, so the same
            # request from the runner is refused however healthy GitLab is. The
            # API the mirror uses has no such limit.
            if docker exec gitlab curl -fsS http://127.0.0.1:8080/-/health >/dev/null 2>&1; then
              echo "healthy after $((i * 10))s"
              exit 0
            fi
            # A service whose pid changes between samples is restarting, not
            # starting. That distinction is what a long timeout hides.
            [ $((i % 6)) -ne 0 ] || docker exec gitlab gitlab-ctl status 2>&1 | sed 's/^/  /' || true
            sleep 10
          done
          echo "GitLab did not come up" >&2
          docker exec gitlab gitlab-ctl status >&2 || true
          docker exec gitlab tail -40 /var/log/gitlab/puma/current >&2 || true
          exit 1

      - name: Seed a token
        run: |
          set -eu
          docker exec gitlab gitlab-rails runner "
            u = User.find_by_username('root')
            t = u.personal_access_tokens.build(
              scopes: ['api'],
              name: 'forge-mirror-e2e',
              expires_at: 365.days.from_now)
            t.set_token('${GITLAB_TOKEN}')
            t.save!
            puts 'seeded'
          "
          # Prove it works before blaming the mirror for a 401.
          curl -fsS -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "${GITLAB}/api/v4/version"
          echo

      - name: Stand in for the repository mirror
        # This program carries no git. In production a repository mirror puts
        # the branches there and this one adds the issues on top, so the test
        # has to arrange the same thing or the open pull request has nothing to
        # be a merge request between.
        #
        # It also fixes the order deliberately: code first, then metadata. That
        # is the order production runs in, and the one where a merge request can
        # be made at all.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          curl -fsS -X POST -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "${GITLAB}/api/v4/groups" \
            -d "name=${FIXTURE_OWNER}&path=${FIXTURE_OWNER}&visibility=private" >/dev/null
          pid=$(curl -fsS -X POST -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "${GITLAB}/api/v4/projects" \
            -d "name=${FIXTURE_REPO}&path=${FIXTURE_REPO}&namespace_id=$(
              curl -fsS -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
                "${GITLAB}/api/v4/groups/${FIXTURE_OWNER}" | jq -r .id
            )&visibility=private" | jq -r .id)
          echo "project ${pid}"

          git clone -q --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${FIXTURE_OWNER}/${FIXTURE_REPO}.git" fixture.git
          git --git-dir=fixture.git push --quiet --mirror \
            "http://oauth2:${GITLAB_TOKEN}@localhost:8080/${FIXTURE_OWNER}/${FIXTURE_REPO}.git"

          curl -fsS -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "${GITLAB}/api/v4/projects/${FIXTURE_OWNER}%2F${FIXTURE_REPO}/repository/branches" \
            | jq -r '.[] | "  branch \(.name)"'

      - name: Build
        run: go build -o forge-mirror .

      - name: Configure
        run: |
          cat > e2e.yaml <<YAML
          source:
            token: "\${env:GH_TOKEN}"
            owner: ${FIXTURE_OWNER}
            repos: [${FIXTURE_REPO}]
          target:
            token: "\${env:GL_TOKEN}"
            baseUrl: ${GITLAB}
            group: ${FIXTURE_OWNER}
          YAML

      - name: First run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GL_TOKEN: ${{ env.GITLAB_TOKEN }}
        run: ./forge-mirror --config e2e.yaml mirror

      - name: What landed
        run: |
          set -eu
          p="${FIXTURE_OWNER}%2F${FIXTURE_REPO}"
          curl -fsS -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "${GITLAB}/api/v4/projects/${p}/issues?per_page=100&state=all" > issues.json
          curl -fsS -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "${GITLAB}/api/v4/projects/${p}/merge_requests?per_page=100&state=all" > mrs.json

          echo "issues: $(jq length issues.json)  merge requests: $(jq length mrs.json)"
          jq -r '.[] | "  issue  !\(.iid) [\(.state)] \(.title)"' issues.json
          jq -r '.[] | "  mr     !\(.iid) [\(.state)] \(.title)"' mrs.json

      - name: The fixtures arrived as the right kind
        run: |
          set -eu
          fail() { echo "FAIL: $*" >&2; exit 1; }

          # 5 issues + 1 merged pull request that becomes an issue.
          [ "$(jq length issues.json)" = "6" ] || fail "expected 6 issues, got $(jq length issues.json)"
          # The open pull request, whose branch still exists.
          [ "$(jq length mrs.json)" = "1" ] || fail "expected 1 merge request, got $(jq length mrs.json)"

          jq -e '.[] | select(.title == "Add merged.txt")' issues.json >/dev/null \
            || fail "the merged pull request should be an issue: its branch is gone"
          jq -e '.[] | select(.title == "Add open.txt")' mrs.json >/dev/null \
            || fail "the open pull request should be a merge request"

          jq -e '.[] | select(.title == "Typo in the calibration guide") | select(.state == "closed")' issues.json >/dev/null \
            || fail "a closed issue should arrive closed"

          # The body that quotes a marker must end up with exactly one: ours.
          n=$(jq -r '.[] | select(.title == "Quoting a mirrored issue") | .description' issues.json \
                | grep -c 'forge-mirror-origin:' || true)
          [ "$n" = "1" ] || fail "expected exactly one marker in the quoting issue, got ${n}"

          echo "OK"

      - name: Comments came across
        run: |
          set -eu
          p="${FIXTURE_OWNER}%2F${FIXTURE_REPO}"
          iid=$(jq -r '.[] | select(.title == "Camera drops frames above 30fps") | .iid' issues.json)
          n=$(curl -fsS -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
                "${GITLAB}/api/v4/projects/${p}/issues/${iid}/notes?per_page=100" | jq length)
          [ "$n" = "2" ] || { echo "FAIL: expected 2 comments, got ${n}" >&2; exit 1; }
          echo "OK"

      # The assertion this whole job exists for.
      - name: Second run creates nothing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GL_TOKEN: ${{ env.GITLAB_TOKEN }}
        run: |
          set -eu
          ./forge-mirror --config e2e.yaml mirror | tee second.txt
          grep -q "created=0" second.txt \
            || { echo "FAIL: a second run over unchanged input created something" >&2; exit 1; }

      - name: Nothing was duplicated
        run: |
          set -eu
          p="${FIXTURE_OWNER}%2F${FIXTURE_REPO}"
          i=$(curl -fsS -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
                "${GITLAB}/api/v4/projects/${p}/issues?per_page=100&state=all" | jq length)
          m=$(curl -fsS -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
                "${GITLAB}/api/v4/projects/${p}/merge_requests?per_page=100&state=all" | jq length)
          [ "$i" = "6" ] && [ "$m" = "1" ] \
            || { echo "FAIL: counts changed on the second run: issues=${i} mrs=${m}" >&2; exit 1; }
          echo "OK"

      - name: GitLab logs
        if: failure()
        run: docker exec gitlab gitlab-ctl status || true
