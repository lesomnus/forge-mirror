# Bakes the GitLab the end-to-end test runs against.
#
# Not built with a Dockerfile. Omnibus converges by *starting* services, and a
# build step has no process supervision to start them under; the data directory
# baked at build time then fights the entrypoint's own reconfigure at run time.
# Running it, seeding it, and committing the container is the way that works.
#
# Worth doing at all because of the token, not the speed. A GitLab that has just
# come up has no API token, so every test run would have to make one with
# `gitlab-rails runner` — another minute of waiting and another thing that can
# fail for reasons that have nothing to do with the code under test. A test
# nobody trusts is worse than no test.
name: testbed

on:
  workflow_dispatch:
    inputs:
      gitlab_version:
        description: GitLab CE version to bake
        default: "19.3.1-ce.0"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lesomnus/forge-mirror-testbed

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start GitLab
        env:
          VERSION: ${{ inputs.gitlab_version }}
        run: |
          set -eu
          # Small on purpose: puma in single mode and one sidekiq worker is
          # enough to answer an API, and the difference decides whether this
          # fits on a hosted runner at all.
          #
          # ⚠️ `puma['port']` has to move off 8080. Omnibus defaults puma to
          # 127.0.0.1:8080, and `external_url` with a port puts **nginx** on the
          # same one. nginx wins the race, puma dies with EADDRINUSE, and runit
          # restarts it forever — from outside it looks like a slow boot, since
          # nginx and workhorse are up and answering 502 the whole time.
          docker run -d --name gitlab \
            --shm-size 256m \
            -p 8080:8080 \
            -e GITLAB_OMNIBUS_CONFIG="
              external_url 'http://localhost:8080';
              puma['port'] = 8081;
              puma['worker_processes'] = 0;
              sidekiq['max_concurrency'] = 2;
              postgresql['shared_buffers'] = '128MB';
              prometheus_monitoring['enable'] = false;
              gitlab_rails['gitlab_shell_ssh_port'] = 2222;
            " \
            "gitlab/gitlab-ce:${VERSION}"

      - name: Wait for it
        # A cold boot runs the migrations, so minutes rather than seconds — but
        # minutes, not tens of them. A limit far past the real time only turns a
        # crash into a long wait, which is how the port collision above went
        # unnoticed for two runs.
        run: |
          set -eu
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/-/health >/dev/null 2>&1; then
              echo "healthy after $((i * 10))s"
              exit 0
            fi
            # `gitlab-ctl status` answers the question being asked — which
            # services are up — and a service whose pid changes between samples
            # is restarting, not starting. The logs are JSON and say it only by
            # implication.
            [ $((i % 6)) -ne 0 ] || docker exec gitlab gitlab-ctl status 2>&1 | sed 's/^/  /' || true
            sleep 10
          done
          echo "GitLab did not come up" >&2
          docker exec gitlab gitlab-ctl status >&2 || true
          docker exec gitlab tail -40 /var/log/gitlab/puma/current >&2 || true
          exit 1

      - name: Seed a known token
        run: |
          set -eu
          # The token is fixed and public on purpose. It is only ever valid
          # against a container this workflow just started and throws away;
          # there is nothing behind it. Keeping it fixed is what lets the test
          # start working immediately instead of parsing one out of a log.
          docker exec gitlab gitlab-rails runner "
            u = User.find_by_username('root')
            u.update!(admin: true)
            t = u.personal_access_tokens.build(
              scopes: ['api'],
              name: 'forge-mirror-e2e',
              expires_at: 365.days.from_now)
            t.set_token('glpat-forgemirrore2etoken')
            t.save!
            puts 'seeded'
          "

      - name: Commit and push
        run: |
          set -eu
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          docker stop gitlab
          docker commit gitlab "${IMAGE}:${{ inputs.gitlab_version }}"
          docker tag "${IMAGE}:${{ inputs.gitlab_version }}" "${IMAGE}:latest"
          docker push "${IMAGE}:${{ inputs.gitlab_version }}"
          docker push "${IMAGE}:latest"
